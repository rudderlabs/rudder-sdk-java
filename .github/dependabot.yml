version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      maven-security:
        applies-to: security-updates
        patterns: ["*"]
      maven-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude: ["rudderlabs/*"]
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns: ["*"]
