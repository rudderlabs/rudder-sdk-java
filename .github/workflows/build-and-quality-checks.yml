name: Build & Code Quality Checks

on:
  pull_request:
    branches: [ 'master', 'develop' ]
    types: [ 'opened', 'reopened', 'synchronize' ]

permissions:
  contents: read

jobs:
  unit_test_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Set up Maven
        run: mvn --version

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Setup
        run: mvn clean && mvn templating:filter-sources

      - name: Unit Test and Build
        run: mvn clean install

      - name: Verify published POMs
        run: |
          version="$(mvn --batch-mode --quiet --no-transfer-progress help:evaluate -Dexpression=revision -DforceStdout)"
          scripts/verify-published-poms.sh "$version"

#      - name: Jacoco Badge generator
#        uses: cicirello/jacoco-badge-generator@v2
#        with:
#          generate-summary: true
#          jacoco-csv-file: analytics-cli/target/site/jacoco-aggregate/jacoco.csv
#
#      - name: Commit and push the badge (if it changed)
#        uses: EndBug/add-and-commit@v9.1.1
#        with:
#          default_author: github_actions
#          message: 'commit badge'
#          add: '*.svg'

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Coverage report
          path: |
            analytics-cli/target/site/jacoco-aggregate/

      - name: PMD lint checking
        run: |
          mvn pmd:pmd
          mvn pmd:cpd

      - name: Upload PMD lint report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PMD lint report
          path: |
            analytics-core/target/site
            analytics/target/site

      - name: Checkstyle lint checking
        run: mvn checkstyle:checkstyle

      - name: Upload Checklist lint report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Checklist lint report
          path: |
            analytics-core/target/site
            analytics/target/site

      - name: Set up JDK 21 for Sonar analysis
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Sonar analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=rudderlabs_rudder-sdk-java
