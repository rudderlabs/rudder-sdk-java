name: Publish to Maven Central

on:
  release:
    types: [published]

concurrency:
  group: maven-central-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign, publish, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: maven-central
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.publication.outputs.already-published == 'true' || steps.upload.outcome == 'success' }}
      public-verified: ${{ steps.public-verified.outcome == 'success' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout the release-event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 17 and Maven Central credentials
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: 17
          distribution: zulu
          server-id: central
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Set up Maven
        run: mvn --version

      - name: Verify the release tag and version
        id: release
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          if [[ "$RELEASE_REF" != "refs/tags/$TAG_NAME" ||
                "$RELEASE_DRAFT" != false || "$RELEASE_PRERELEASE" != false ||
                "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo 'Release metadata, event ref, and checked-out tag commit must agree.' >&2
            exit 1
          fi

          git tag --points-at HEAD | grep -Fx "$TAG_NAME"
          git merge-base --is-ancestor HEAD origin/master

          version="${TAG_NAME#v}"
          pom_version="$(mvn --batch-mode --quiet --no-transfer-progress \
            help:evaluate -Dexpression=revision -DforceStdout)"

          if [[ "$pom_version" != "$version" ]]; then
            echo "Tag $TAG_NAME does not match POM revision $pom_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check whether the version is already public
        id: publication
        run: |
          set -euo pipefail

          pom_url="https://repo1.maven.org/maven2/com/rudderstack/sdk/java/analytics/analytics/${RELEASE_VERSION}/analytics-${RELEASE_VERSION}.pom"

          if curl --fail --silent --head "$pom_url" >/dev/null; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${RELEASE_VERSION} is already public. The workflow will verify it without publishing again."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate publishing secrets and import the signing key
        if: ${{ steps.publication.outputs.already-published != 'true' }}
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for name in NEXUS_USERNAME NEXUS_PASSWORD SIGNING_KEY_ID SIGNING_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required maven-central Environment secret: $name" >&2
              exit 1
            fi
          done

          gnupg_home="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$gnupg_home"
          echo "GNUPGHOME=$gnupg_home" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID=$SIGNING_KEY_ID" >> "$GITHUB_ENV"

          printf '%s' "$SIGNING_PRIVATE_KEY_BASE64" | base64 --decode | \
            GNUPGHOME="$gnupg_home" gpg --batch --import
          GNUPGHOME="$gnupg_home" gpg --batch --list-secret-keys "$SIGNING_KEY_ID"

      - name: Build, test, sign, and validate release artifacts
        if: ${{ steps.publication.outputs.already-published != 'true' }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -Prelease \
            -Dgpg.keyname="$GPG_KEY_ID" \
            clean verify
          scripts/verify-release-artifacts.sh "$RELEASE_VERSION"

      - name: Publish and wait for Maven Central
        id: upload
        if: ${{ steps.publication.outputs.already-published != 'true' }}
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -Prelease \
            -DskipTests \
            -Dgpg.keyname="$GPG_KEY_ID" \
            -Dcentral.autoPublish=true \
            -Dcentral.waitUntil=published \
            deploy

      - name: Verify the public Maven Central release
        id: public-verified
        run: scripts/verify-maven-central-release.sh "$RELEASE_VERSION"

  published-e2e:
    name: Accept exact published package
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/published-sdk-e2e.yml
    with:
      package-version: ${{ needs.publish.outputs.version }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-release:
    name: Report final Java SDK release status
    needs: [publish, published-e2e]
    if: ${{ always() && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
      PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
      CENTRAL_URL: https://central.sonatype.com/artifact/com.rudderstack.sdk.java.analytics/analytics/${{ needs.publish.outputs.version }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      UPLOAD_CONFIRMED: ${{ needs.publish.outputs.published }}
      PUBLIC_VERIFIED: ${{ needs.publish.outputs.public-verified }}
      E2E_RESULT: ${{ needs.published-e2e.result }}
      CENTRAL_RUN_URL: ${{ needs.published-e2e.outputs.run-url }}
      SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Prepare one final status and its details
        id: status
        shell: bash
        run: |
          set -euo pipefail
          release_date="${RELEASE_PUBLISHED_AT%%T*}"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            release_date="$(date -u +%F)"
          fi

          if [[ "$PUBLISH_RESULT" == success && "$PUBLIC_VERIFIED" == true && "$E2E_RESULT" == success ]]; then
            status='release complete'
          elif [[ "$UPLOAD_CONFIRMED" == true ]]; then
            status='published; validation failed or incomplete'
          else
            status='publication failed or incomplete; upload not confirmed'
          fi

          root="Java SDK $TAG_NAME ($release_date): $status. CC: <!subteam^S03SW7DM8P3>"
          details="Release: <$RELEASE_URL|GitHub release>; run: <$RUN_URL|workflow>"
          if [[ -n "$PACKAGE_VERSION" ]]; then
            details="${details}; artifact: <$CENTRAL_URL|Maven Central>"
          fi
          details="${details}. Public registry verification: $PUBLIC_VERIFIED. Full E2E delivery and cleanup: $E2E_RESULT."
          if [[ -n "$CENTRAL_RUN_URL" ]]; then
            details="${details} Central validation: <$CENTRAL_RUN_URL|run>."
          fi
          printf '%s\n\n%s\n' "$root" "$details" >> "$GITHUB_STEP_SUMMARY"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'details=%s\n' "$details" >> "$GITHUB_OUTPUT"

      - name: Post release status root
        id: root
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": ${{ toJSON(env.SLACK_RELEASE_CHANNEL_ID) }},
              "text": ${{ toJSON(steps.status.outputs.root) }},
              "unfurl_links": false,
              "unfurl_media": false
            }

      - name: Post non-broadcast detail reply
        id: reply
        if: ${{ steps.root.outputs.ok == 'true' && steps.root.outputs.ts != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": ${{ toJSON(env.SLACK_RELEASE_CHANNEL_ID) }},
              "thread_ts": ${{ toJSON(steps.root.outputs.ts) }},
              "text": ${{ toJSON(steps.status.outputs.details) }},
              "reply_broadcast": false,
              "unfurl_links": false,
              "unfurl_media": false
            }

      - name: Require confirmed release notification
        if: always()
        env:
          ROOT_OK: ${{ steps.root.outputs.ok }}
          ROOT_TS: ${{ steps.root.outputs.ts }}
          REPLY_OK: ${{ steps.reply.outputs.ok }}
        run: |
          if [[ "$ROOT_OK" != true || ! "$ROOT_TS" =~ ^[0-9]+\.[0-9]+$ || "$REPLY_OK" != true ]]; then
            echo 'Release notification failed or was not confirmed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
