name: Publish to Maven Central

on:
  release:
    types: [published]

concurrency:
  group: maven-central-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign, publish, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: maven-central
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      published: ${{ steps.publication.outputs.already-published == 'true' || steps.deployed.outcome == 'success' }}
      public-verified: ${{ steps.public-verified.outcome == 'success' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17 and Maven Central credentials
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: 17
          distribution: zulu
          server-id: central
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Set up Maven
        run: mvn --version

      - name: Verify the release tag and version
        id: release
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          EVENT_REF: ${{ github.ref }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          scripts/verify-release-origin.sh "$TAG_NAME" "$EVENT_REF" \
            "$RELEASE_DRAFT" "$RELEASE_PRERELEASE"

      - name: Check whether the version is already public
        id: publication
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          pom_url="https://repo1.maven.org/maven2/com/rudderstack/sdk/java/analytics/analytics/${RELEASE_VERSION}/analytics-${RELEASE_VERSION}.pom"

          if curl --fail --silent --head "$pom_url" >/dev/null; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${RELEASE_VERSION} is already public. The workflow will verify it without publishing again."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate publishing secrets and import the signing key
        if: ${{ steps.publication.outputs.already-published != 'true' }}
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for name in NEXUS_USERNAME NEXUS_PASSWORD SIGNING_KEY_ID SIGNING_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required maven-central Environment secret: $name" >&2
              exit 1
            fi
          done

          gnupg_home="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$gnupg_home"
          echo "GNUPGHOME=$gnupg_home" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID=$SIGNING_KEY_ID" >> "$GITHUB_ENV"

          printf '%s' "$SIGNING_PRIVATE_KEY_BASE64" | base64 --decode | \
            GNUPGHOME="$gnupg_home" gpg --batch --import
          GNUPGHOME="$gnupg_home" gpg --batch --list-secret-keys "$SIGNING_KEY_ID"

      - name: Build, test, sign, and validate release artifacts
        if: ${{ steps.publication.outputs.already-published != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -Prelease \
            -Dgpg.keyname="$GPG_KEY_ID" \
            clean verify
          scripts/verify-release-artifacts.sh "$RELEASE_VERSION"

      - name: Publish and wait for Maven Central
        id: deployed
        if: ${{ steps.publication.outputs.already-published != 'true' }}
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -Prelease \
            -DskipTests \
            -Dgpg.keyname="$GPG_KEY_ID" \
            -Dcentral.autoPublish=true \
            -Dcentral.waitUntil=published \
            deploy

      - name: Verify the public Maven Central release
        id: public-verified
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: scripts/verify-maven-central-release.sh "$RELEASE_VERSION"

  published-e2e:
    name: Accept exact published package with full E2E
    needs: [publish]
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/published-package-e2e.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      source-sha: ${{ needs.publish.outputs.commit }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-success:
    name: Notify publication and full E2E acceptance
    needs: [publish, published-e2e]
    if: ${{ needs.publish.result == 'success' && needs.published-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
      CENTRAL_URL: https://central.sonatype.com/artifact/com.rudderstack.sdk.java.analytics/analytics/${{ needs.publish.outputs.version }}
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Notify Slack channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "Java SDK ${{ env.TAG_NAME }} is public on Maven Central and passed full published-package E2E: ${{ env.CENTRAL_URL }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":package: Java SDK release accepted"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*<${{ env.RELEASE_URL }}|${{ env.TAG_NAME }}>* is public on *<${{ env.CENTRAL_URL }}|Maven Central>* and passed full published-package E2E delivery and cleanup.\nCC: <!subteam^S03SW7DM8P3>"
                  }
                }
              ]
            }

  notify-failure:
    name: Notify incomplete publication or E2E acceptance
    needs: [publish, published-e2e]
    if: ${{ always() && (needs.publish.result != 'success' || needs.published-e2e.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TAG_NAME: ${{ github.event.release.tag_name }}
      PUBLICATION_CONFIRMED: ${{ needs.publish.outputs.published }}
      PUBLIC_VERIFIED: ${{ needs.publish.outputs.public-verified }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Select failure status
        id: status
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          E2E_RESULT: ${{ needs.published-e2e.result }}
        run: |
          if [[ "$PUBLIC_VERIFIED" == true ]]; then
            message="Java SDK $TAG_NAME passed exact public Maven verification but full E2E acceptance did not complete (E2E: $E2E_RESULT). No unpublish was attempted. Retry validation only: $RUN_URL"
          elif [[ "$PUBLICATION_CONFIRMED" == true ]]; then
            message="Java SDK $TAG_NAME publication was reported by Central, but exact public verification or full E2E acceptance did not complete (publish: $PUBLISH_RESULT, E2E: $E2E_RESULT). No unpublish was attempted. Inspect: $RUN_URL"
          else
            message="Java SDK $TAG_NAME publication was not confirmed (publish: $PUBLISH_RESULT, E2E: $E2E_RESULT). Inspect: $RUN_URL"
          fi
          echo "message=$(jq -cn --arg message "$message" '$message')" >> "$GITHUB_OUTPUT"

      - name: Notify Slack channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": ${{ steps.status.outputs.message }}
            }
