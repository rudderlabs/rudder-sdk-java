name: Accept published Java SDK package

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source-sha:
        type: string
        required: true
    secrets:
      RELEASE_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  accept:
    name: Full published-package delivery and cleanup
    # Only the release event or a retry from the trusted master workflow may dispatch.
    if: >-
      github.repository == 'rudderlabs/rudder-sdk-java' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # SDK-5961/SDK-5962 have not landed on the action's main branch yet.
      # This known pin cannot run published mode: fail closed until a reviewed SHA
      # supports package-version AND source-sha, and central full acceptance.
      - name: Require published-mode action dependency
        run: |
          echo 'Published-package full E2E needs the reviewed SDK-5961/SDK-5962 action SHA and central support.' >&2
          exit 1

      - name: Create central validation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: rudder-sdk-e2e-tests
          permission-actions: write

      # RESOLVE: Replace this candidate-only SHA with the reviewed published-mode SHA
      # once SDK-5961/SDK-5962 land; remove the fail-closed step above.
      - name: Dispatch and wait for full published-package E2E
        uses: rudderlabs/github-action-sdk-e2e@9bcd97f1b28b1f2c3c7726ccae1bf435f4acf9c4 # SDK-5961/SDK-5962 dependency; draft only
        with:
          token: ${{ steps.token.outputs.token }}
          suite: full
          package: com.rudderstack.sdk.java.analytics:analytics
          package-version: ${{ inputs.version }}
          source-sha: ${{ inputs.source-sha }}
