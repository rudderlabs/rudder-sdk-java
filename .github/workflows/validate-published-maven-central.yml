name: Retry published Java SDK acceptance (no publication)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable published GitHub release tag (vX.Y.Z)
        required: true
        type: string
      expected-commit:
        description: Full 40-character release tag commit SHA (not a branch or tag)
        required: true
        type: string

concurrency:
  group: maven-central-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-public:
    name: Confirm release provenance and exact public artifact
    if: ${{ github.repository == 'rudderlabs/rudder-sdk-java' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Validate retry inputs before checkout
        env:
          TAG_NAME: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        run: |
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out trusted master workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: 17
          distribution: zulu

      - name: Confirm published GitHub release and tag tip
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME")"
          draft="$(jq -r '.draft' <<< "$release_json")"
          prerelease="$(jq -r '.prerelease' <<< "$release_json")"
          published_at="$(jq -r '.published_at' <<< "$release_json")"
          release_tag="$(jq -r '.tag_name' <<< "$release_json")"
          [[ "$published_at" != null && "$release_tag" == "$TAG_NAME" ]]
          scripts/verify-release-origin.sh "$TAG_NAME" "refs/tags/$TAG_NAME" \
            "$draft" "$prerelease" "$EXPECTED_COMMIT" release

      - name: Verify the exact public Maven Central release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: scripts/verify-maven-central-release.sh "$RELEASE_VERSION"

  published-e2e:
    name: Recheck full published-package E2E
    needs: [verify-public]
    if: ${{ needs.verify-public.result == 'success' }}
    uses: ./.github/workflows/published-package-e2e.yml
    with:
      version: ${{ needs.verify-public.outputs.version }}
      source-sha: ${{ needs.verify-public.outputs.commit }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-success:
    name: Notify successful validation-only retry
    needs: [verify-public, published-e2e]
    if: ${{ needs.verify-public.result == 'success' && needs.published-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Notify Slack channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "Java SDK ${{ inputs.tag }} passed exact public Maven verification and full E2E delivery/cleanup on validation-only retry: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  notify-failure:
    name: Notify incomplete validation-only retry
    needs: [verify-public, published-e2e]
    if: ${{ always() && (needs.verify-public.result != 'success' || needs.published-e2e.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Notify Slack channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": ${{ toJSON(format('Java SDK {0} validation-only retry did not establish release acceptance (public verification: {1}, full E2E: {2}). No publication or unpublish was attempted: https://github.com/{3}/actions/runs/{4}', inputs.tag, needs.verify-public.result, needs.published-e2e.result, github.repository, github.run_id)) }}
            }
